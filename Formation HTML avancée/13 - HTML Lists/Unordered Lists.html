<!DOCTYPE html>
<html>

<head>
    <title>SoliCode Log</title>
    <style>
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: rgb(13, 13, 90);

        }

        li {
            float: left;
        }
        li a {
            display: block;
            color: yellow;
            text-align: center;
            padding: 16px;
            text-decoration: none;
        }

        li a:hover {
            background-color: rgb(0, 0, 136);
        }
    </style>
</head>

<body>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="about">About</a></li>
        <li><a href="contact">Contact</a></li>
        <li><a href="location">Location</a></li>
    </ul>


</body>


</html>
